<!DOCTYPE html>
<html lang="af">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Die Karstens - Sosiale Media</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts: Pacifico & Nunito -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Pacifico&display=swap" rel="stylesheet">
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        .font-pacifico { font-family: 'Pacifico', cursive; }
        body { 
            font-family: 'Nunito', sans-serif; 
            background-color: #fdfcf0; 
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .glass-card:hover {
            transform: translateY(-12px);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
        }

        .social-btn {
            display: flex;
            align-items: center;
            padding: 0.6rem 1rem;
            border-radius: 12px;
            color: white;
            font-weight: 600;
            transition: all 0.2s ease;
            text-decoration: none;
            width: 100%;
            margin-bottom: 0.75rem;
        }

        .social-btn:active { transform: scale(0.95); }

        .btn-facebook { background-color: #1877F2; }
        .btn-instagram { background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); }
        .btn-tiktok { background-color: #000000; }
        .btn-tiktok:hover { background-color: #25F4EE; color: #000; }

        /* Foto Sirkel Houer */
        .profile-avatar {
            width: 100px;
            height: 100px;
            margin: -50px auto 15px auto;
            border-radius: 50%;
            background: white;
            padding: 4px;
            box-shadow: 0 8px 15px rgba(0,0,0,0.1);
            overflow: hidden;
            position: relative;
            z-index: 10;
        }

        .profile-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        .nav-link {
            transition: all 0.3s;
            position: relative;
        }
        .nav-link::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: 0;
            left: 0;
            background-color: #f97316;
            transition: width 0.3s;
        }
        .nav-link:hover::after { width: 100%; }
    </style>
</head>
<body class="text-gray-800">

    <header class="bg-white/80 backdrop-blur-md shadow-sm sticky top-0 z-50">
        <div class="container mx-auto px-6 py-4">
            <div class="flex justify-between items-center">
                <a href="index.html" class="text-3xl font-pacifico text-orange-500">Die Karstens</a>
                <nav class="hidden lg:flex items-center space-x-6 font-bold text-gray-600">
                    <a href="index.html" class="nav-link px-2 py-1">Tuis</a>
                    <a href="BoyOrGirl.html" class="nav-link px-2 py-1">Gender Reveal!</a>
                    <a href="Familielede.html" class="nav-link px-2 py-1">Familielede</a>
                    <a href="sosiale_media.html" class="text-orange-500 border-b-2 border-orange-500 px-2 py-1">Sosiale Media</a>
                    <a href="application_form.html" class="nav-link px-2 py-1">Aansoekvorm</a>
                    <a href="Karstein_Files.html" class="nav-link px-2 py-1">Karstein Files</a>
                </nav>
                <button id="mobile-menu-button" class="lg:hidden p-2 text-gray-600">
                    <i data-lucide="menu"></i>
                </button>
            </div>
            <div id="mobile-menu" class="hidden lg:hidden mt-4 pb-4">
                <nav class="flex flex-col space-y-3 font-bold text-center">
                    <a href="index.html" class="py-2">Tuis</a>
                    <a href="BoyOrGirl.html" class="py-2">Gender Reveal!</a>
                    <a href="Familielede.html" class="py-2">Familielede</a>
                    <a href="sosiale_media.html" class="py-2 bg-orange-50 text-orange-500 rounded-xl">Sosiale Media</a>
                    <a href="application_form.html" class="py-2">Aansoekvorm</a>
                    <a href="Karstein_Files.html" class="py-2">Karstein Files</a>
                </nav>
            </div>
        </div>
    </header>

    <main class="pt-24 pb-24">
        <div class="container mx-auto px-6 text-center mb-24">
            <h1 class="font-pacifico text-5xl sm:text-6xl text-gray-900 mb-6">Volg Ons Avonture</h1>
            <p class="text-lg text-gray-600 max-w-2xl mx-auto">Klik op die knoppies om ons op sosiale media te vind.</p>
        </div>

        <div class="container mx-auto px-6">
            <div id="social-grid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-y-20 gap-x-10">
                <!-- JavaScript populeer hierdie kaarte -->
            </div>
        </div>
    </main>

    <footer class="bg-gray-900 text-white pt-16 pb-8">
        <div class="container mx-auto px-6 text-center">
            <h2 class="font-pacifico text-3xl text-orange-400 mb-4">Die Karstens</h2>
            <p class="text-sm text-gray-500 font-bold">&copy; 2026 Die Karstens. Alle Regte Voorbehou.</p>
        </div>
    </footer>

    <script>
        const familyData = [

                }

                }
            }
        ];

        const grid = document.getElementById('social-grid');

        familyData.forEach(member => {
            const card = document.createElement('div');
            card.className = `glass-card rounded-3xl p-8 pt-0 flex flex-col items-center border-t-4 ${member.color}`;
            card.innerHTML = `
                <div class="profile-avatar">
                    <img src="${member.img}" alt="${member.name}" onerror="this.src='https://placehold.co/100x100?text=${member.name.split(' ')[0]}'">
                </div>
                <h3 class="text-2xl font-bold text-gray-800 mb-6">${member.name}</h3>
                <div class="w-full space-y-3">
                    <a href="${member.links.facebook}" target="_blank" class="social-btn btn-facebook">
                        <i data-lucide="facebook" class="w-5 h-5 mr-3"></i> Facebook
                    </a>
                    <a href="${member.links.instagram}" target="_blank" class="social-btn btn-instagram">
                        <i data-lucide="instagram" class="w-5 h-5 mr-3"></i> Instagram
                    </a>
                    <a href="${member.links.tiktok}" target="_blank" class="social-btn btn-tiktok">
                        <i data-lucide="music-2" class="w-5 h-5 mr-3"></i> TikTok
                    </a>
                </div>
            `;
            grid.appendChild(card);
        });

        lucide.createIcons();

        const btn = document.getElementById('mobile-menu-button');
        const menu = document.getElementById('mobile-menu');
        btn.addEventListener('click', () => menu.classList.toggle('hidden'));
    </script>
</body>
</html>
