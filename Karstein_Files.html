<html lang="af">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Die Karstens - Karstein Files</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts: Pacifico & Nunito -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&family=Pacifico&display=swap" rel="stylesheet">
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        .font-pacifico {
            font-family: 'Pacifico', cursive;
        }
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #FFF8E1; 
        }
        .nav-link-hover {
            transition: all 0.2s ease;
        }
        .nav-link-hover:hover {
            background-color: #fff7ed;
            color: #f97316;
        }
        /* Lightbox styl */
        #lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        #lightbox img {
            max-width: 90%;
            max-height: 80%;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            border-radius: 8px;
        }
    </style>
</head>
<body class="flex flex-col min-h-screen">

    <!-- Navigasie -->
    <nav class="bg-white shadow-md sticky top-0 z-50">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center">
            <a href="index.html" class="text-2xl font-pacifico text-orange-500">Die Karstens</a>
            
            <nav class="hidden lg:flex items-center space-x-1 font-bold text-gray-600">
                <a href="index.html" class="px-4 py-2 rounded-full nav-link-hover">Tuis</a>
                <a href="BoyOrGirl.html" class="px-4 py-2 rounded-full nav-link-hover">Gender Reveal!</a>
                <a href="Familielede.html" class="px-4 py-2 rounded-full nav-link-hover">Familielede</a>
                <a href="sosiale_media.html" class="px-4 py-2 rounded-full nav-link-hover">Sosiale Media</a>
                <a href="application_form.html" class="px-4 py-2 rounded-full nav-link-hover">Aansoekvorm</a>
                <a href="Karstein_Files.html" class="px-4 py-2 rounded-full text-orange-500 bg-orange-50 nav-link-hover">Karstein Files</a>
            </nav>

            <button id="mobile-menu-button" class="lg:hidden p-2 text-gray-600 hover:text-orange-500">
                <i data-lucide="menu" id="menu-icon"></i>
            </button>
        </div>
        
        <div id="mobile-menu" class="hidden lg:hidden mt-4 pb-4 border-t border-gray-100 bg-white">
            <nav class="flex flex-col space-y-2 pt-4 font-bold text-center">
                <a href="index.html" class="py-2 hover:text-orange-500">Tuis</a>
                <a href="BoyOrGirl.html" class="py-2 hover:text-orange-500">Gender Reveal!</a>
                <a href="Familielede.html" class="py-2 hover:text-orange-500">Familielede</a>
                <a href="sosiale_media.html" class="py-2 hover:text-orange-500">Sosiale Media</a>
                <a href="application_form.html" class="py-2 hover:text-orange-500">Aansoekvorm</a>
                <a href="Karstein_Files.html" class="py-2 text-orange-500 bg-orange-50 rounded-lg">Karstein Files</a>
            </nav>
        </div>
    </nav>

    <!-- Hoof Inhoud -->
    <main class="flex-grow container mx-auto px-6 py-10 text-center">
        <div class="mb-10">
            <h1 class="text-4xl md:text-5xl font-pacifico text-orange-500 mb-4">Karstein Files</h1>
            <p class="text-gray-700 text-lg max-w-2xl mx-auto italic">Tik op 'n foto om dit volskerm te sien.</p>
        </div>

        <!-- Paginering Knoppies -->
        <div id="pagination-top" class="flex flex-wrap justify-center gap-2 mb-8">
            <!-- JavaScript sal bladsy-knoppies hier sit -->
        </div>

        <!-- Rooster vir die fotos -->
        <div id="files-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-6">
            <!-- JavaScript sal hierdie vul met 10 fotos op 'n slag -->
        </div>

        <div id="pagination-bottom" class="flex flex-wrap justify-center gap-2 mt-12">
            <!-- JavaScript sal ook hier bladsy-knoppies sit -->
        </div>
    </main>

    <!-- Lightbox Modal -->
    <div id="lightbox" onclick="closeLightbox()">
        <button class="absolute top-5 right-5 text-white bg-black/50 p-2 rounded-full hover:bg-orange-500 transition-colors">
            <i data-lucide="x" class="w-8 h-8"></i>
        </button>
        <img id="lightbox-img" src="" alt="Volskerm beeld" onclick="event.stopPropagation()">
        <div class="mt-6 flex gap-4">
            <a id="download-btn-full" href="#" download class="bg-orange-500 hover:bg-orange-600 text-white font-bold py-3 px-8 rounded-full shadow-xl flex items-center gap-2" onclick="event.stopPropagation()">
                <i data-lucide="download" class="w-5 h-5"></i>
                Laai Hierdie Foto Af
            </a>
        </div>
    </div>

    <!-- Voetskrif -->
    <footer class="bg-gray-800 text-white mt-12">
        <div class="container mx-auto px-6 py-8 text-center">
            <p class="text-sm sm:text-base font-bold">&copy; 2026 Die Karstens. Alle Regte Voorbehou.</p>
        </div>
    </footer>

    <!-- Skripte -->
    <script>
        const totalItems = 90;
        const itemsPerPage = 10;
        let currentPage = 1;

        // Hierdie funksie probeer verskillende formate as die eerste een misluk
        function tryNextExtension(imgElement, codeName) {
            const extensions = ['.jpeg', '.jpg', '.png', '.JPG'];
            // Kry die huidige uitbreiding van die src
            const currentSrc = imgElement.src;
            let currentIndex = -1;
            
            for (let i = 0; i < extensions.length; i++) {
                if (currentSrc.endsWith(extensions[i])) {
                    currentIndex = i;
                    break;
                }
            }

            // As daar nog 'n uitbreiding is om te probeer
            if (currentIndex < extensions.length - 1) {
                const nextExt = extensions[currentIndex + 1];
                imgElement.src = codeName + nextExt;
            } else {
                // As alles misluk, wys die placeholder
                imgElement.src = 'https://via.placeholder.com/300x300?text=Geen+Foto';
                imgElement.onerror = null; // Verhoed oneindige loops
            }
        }

        function openLightbox(imgSrc) {
            const lightbox = document.getElementById('lightbox');
            const lightboxImg = document.getElementById('lightbox-img');
            const downloadBtn = document.getElementById('download-btn-full');
            
            lightboxImg.src = imgSrc;
            downloadBtn.href = imgSrc;
            lightbox.style.display = 'flex';
            document.body.style.overflow = 'hidden';
            lucide.createIcons();
        }

        function closeLightbox() {
            document.getElementById('lightbox').style.display = 'none';
            document.body.style.overflow = 'auto';
        }

        function renderGallery(page) {
            const grid = document.getElementById('files-grid');
            grid.innerHTML = '';
            
            const start = (page - 1) * itemsPerPage + 1;
            const end = Math.min(page * itemsPerPage, totalItems);

            for (let i = start; i <= end; i++) {
                const idNumber = String(i).padStart(8, '0');
                const codeName = `KFTA${idNumber}`;
                // Ons begin altyd met .jpeg as verstek
                const initialSrc = `${codeName}.jpeg`;

                const card = document.createElement('div');
                card.className = "bg-white rounded-xl shadow-sm p-3 flex flex-col items-center border border-gray-200 hover:border-orange-400 hover:shadow-lg transition-all transform hover:-translate-y-1 duration-300";

                card.innerHTML = `
                    <div class="w-full aspect-square bg-gray-50 rounded-lg mb-3 overflow-hidden relative group cursor-pointer" onclick="openLightbox(this.querySelector('img').src)">
                        <img src="${initialSrc}" 
                             alt="${codeName}" 
                             class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" 
                             onerror="tryNextExtension(this, '${codeName}')">
                        <div class="absolute inset-0 bg-black/20 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
                             <i data-lucide="maximize-2" class="text-white w-8 h-8"></i>
                        </div>
                    </div>
                    <div class="w-full text-left">
                        <h3 class="font-bold text-gray-800 text-xs truncate">${codeName}</h3>
                        <div class="flex justify-between items-center mt-2">
                             <span class="text-[10px] text-gray-400 font-mono">#${i}</span>
                             <a href="#" onclick="event.preventDefault(); window.open(this.parentElement.parentElement.previousElementSibling.querySelector('img').src)" class="text-orange-500 hover:text-orange-700 transition-colors p-1" title="Laai af">
                                <i data-lucide="download" class="w-4 h-4"></i>
                             </a>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            }
            lucide.createIcons();
            renderPagination();
        }

        function renderPagination() {
            const containers = [document.getElementById('pagination-top'), document.getElementById('pagination-bottom')];
            const totalPages = Math.ceil(totalItems / itemsPerPage);

            containers.forEach(container => {
                container.innerHTML = '';
                for (let i = 1; i <= totalPages; i++) {
                    const btn = document.createElement('button');
                    const start = (i - 1) * itemsPerPage + 1;
                    const end = Math.min(i * itemsPerPage, totalItems);
                    
                    btn.innerText = `${start}-${end}`;
                    btn.className = `px-3 py-1.5 rounded-lg font-bold text-sm transition-all ${currentPage === i ? 'bg-orange-500 text-white shadow-md' : 'bg-white text-gray-600 hover:bg-orange-100 border border-gray-200'}`;
                    
                    btn.onclick = () => {
                        currentPage = i;
                        renderGallery(i);
                        window.scrollTo({ top: 0, behavior: 'smooth' });
                    };
                    container.appendChild(btn);
                }
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderGallery(1);

            const menuButton = document.getElementById('mobile-menu-button');
            const mobileMenu = document.getElementById('mobile-menu');
            const menuIcon = document.getElementById('menu-icon');
            
            menuButton.addEventListener('click', () => {
                const isHidden = mobileMenu.classList.toggle('hidden');
                menuIcon.setAttribute('data-lucide', isHidden ? 'menu' : 'x');
                lucide.createIcons();
            });
        });
    </script>
</body>
</html>
